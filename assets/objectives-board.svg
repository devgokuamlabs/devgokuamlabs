<svg width="1280" height="350" viewBox="0 0 1280 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Objectives</title>
  <desc id="desc">Four clear objectives for the professional work account.</desc>
  <defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset="0.55" stop-color="#38BDF8"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
  <rect width="1280" height="350" rx="34" fill="#050816"/>
  <text x="56" y="59" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800">ENGINEERING OBJECTIVES</text>
  <text x="56" y="88" fill="#64748B" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2">WHAT THIS WORKSPACE IS DESIGNED TO DELIVER</text>
  <path d="M56 106H1224" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(56 137)"><rect width="270" height="160" rx="26" fill="#0B1424" stroke="#155E75"/><text x="23" y="37" fill="#22D3EE" font-family="Consolas, monospace" font-size="13" font-weight="700">01</text><text x="23" y="75" fill="#F8FAFC" font-size="19" font-weight="700">Build useful products</text><text x="23" y="106" fill="#94A3B8" font-size="14">Clear software for real</text><text x="23" y="129" fill="#94A3B8" font-size="14">operational requirements.</text></g>
    <g transform="translate(355 137)"><rect width="270" height="160" rx="26" fill="#0B1424" stroke="#0369A1"/><text x="23" y="37" fill="#38BDF8" font-family="Consolas, monospace" font-size="13" font-weight="700">02</text><text x="23" y="75" fill="#F8FAFC" font-size="19" font-weight="700">Support field teams</text><text x="23" y="106" fill="#94A3B8" font-size="14">Practical web and mobile</text><text x="23" y="129" fill="#94A3B8" font-size="14">experiences for programs.</text></g>
    <g transform="translate(654 137)"><rect width="270" height="160" rx="26" fill="#0B1424" stroke="#0F766E"/><text x="23" y="37" fill="#2DD4BF" font-family="Consolas, monospace" font-size="13" font-weight="700">03</text><text x="23" y="75" fill="#F8FAFC" font-size="19" font-weight="700">Maintain work repos</text><text x="23" y="106" fill="#94A3B8" font-size="14">Readable code, documentation</text><text x="23" y="129" fill="#94A3B8" font-size="14">and repeatable delivery.</text></g>
    <g transform="translate(953 137)"><rect width="271" height="160" rx="26" fill="#0B1424" stroke="#6D28D9"/><text x="23" y="37" fill="#A78BFA" font-family="Consolas, monospace" font-size="13" font-weight="700">04</text><text x="23" y="75" fill="#F8FAFC" font-size="19" font-weight="700">Operate dependable tools</text><text x="23" y="106" fill="#94A3B8" font-size="14">Services, data and systems</text><text x="23" y="129" fill="#94A3B8" font-size="14">that remain maintainable.</text></g>
  </g>
  <rect x="1" y="1" width="1278" height="348" rx="33" fill="none" stroke="#334155" stroke-width="2"/>
</svg>
