  <title id="title">Engineering Objectives</title>
  <desc id="desc">Four clear objectives for the professional work account.</desc>
  <defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset="0.55" stop-color="#38BDF8"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
  <rect width="1280" height="390" rx="36" fill="#050816"/>
  <text x="56" y="66" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800">ENGINEERING OBJECTIVES</text>
  <text x="56" y="99" fill="#7C93AE" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="1.8">WHAT THIS WORKSPACE IS DESIGNED TO DELIVER</text>
  <path d="M56 119H1224" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(56 151)"><rect width="270" height="180" rx="27" fill="#0B1424" stroke="#155E75" stroke-width="1.5"/><text x="24" y="40" fill="#22D3EE" font-family="Consolas, monospace" font-size="16" font-weight="700">01</text><text x="24" y="82" fill="#F8FAFC" font-size="22" font-weight="700">Build useful products</text><text x="24" y="119" fill="#B3C2D3" font-size="17">Clear software for real</text><text x="24" y="146" fill="#B3C2D3" font-size="17">operational requirements.</text></g>
    <g transform="translate(355 151)"><rect width="270" height="180" rx="27" fill="#0B1424" stroke="#0369A1" stroke-width="1.5"/><text x="24" y="40" fill="#38BDF8" font-family="Consolas, monospace" font-size="16" font-weight="700">02</text><text x="24" y="82" fill="#F8FAFC" font-size="22" font-weight="700">Support field teams</text><text x="24" y="119" fill="#B3C2D3" font-size="17">Practical web and mobile</text><text x="24" y="146" fill="#B3C2D3" font-size="17">experiences for programs.</text></g>
    <g transform="translate(654 151)"><rect width="270" height="180" rx="27" fill="#0B1424" stroke="#0F766E" stroke-width="1.5"/><text x="24" y="40" fill="#2DD4BF" font-family="Consolas, monospace" font-size="16" font-weight="700">03</text><text x="24" y="82" fill="#F8FAFC" font-size="22" font-weight="700">Maintain work repos</text><text x="24" y="119" fill="#B3C2D3" font-size="17">Readable code and clear</text><text x="24" y="146" fill="#B3C2D3" font-size="17">delivery documentation.</text></g>
    <g transform="translate(953 151)"><rect width="271" height="180" rx="27" fill="#0B1424" stroke="#6D28D9" stroke-width="1.5"/><text x="24" y="40" fill="#A78BFA" font-family="Consolas, monospace" font-size="16" font-weight="700">04</text><text x="24" y="82" fill="#F8FAFC" font-size="22" font-weight="700">Operate reliably</text><text x="24" y="119" fill="#B3C2D3" font-size="17">Maintainable services,</text><text x="24" y="146" fill="#B3C2D3" font-size="17">data and systems.</text></g>
