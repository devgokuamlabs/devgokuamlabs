<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">devgokuamlabs professional engineering workspace</title>
  <desc id="desc">A modern high-contrast banner for applied software engineering across web, mobile, IoT, data and infrastructure.</desc>
  <defs>
