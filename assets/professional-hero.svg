        <rect width="92" height="30" rx="15" fill="#082F49"/><text x="46" y="20" fill="#7DD3FC" text-anchor="middle">WEB</text>
        <rect x="103" width="104" height="30" rx="15" fill="#0C2A3C"/><text x="155" y="20" fill="#BAE6FD" text-anchor="middle">MOBILE</text>
        <rect x="218" width="76" height="30" rx="15" fill="#052E2B"/><text x="256" y="20" fill="#5EEAD4" text-anchor="middle">IoT</text>
        <rect x="305" width="82" height="30" rx="15" fill="#251747"/><text x="346" y="20" fill="#C4B5FD" text-anchor="middle">DATA</text>
        <rect x="398" width="121" height="30" rx="15" fill="#14213A"/><text x="458" y="20" fill="#CBD5E1" text-anchor="middle">INFRASTRUCTURE</text>
      </g>

