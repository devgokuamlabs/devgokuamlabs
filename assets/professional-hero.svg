    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#081A2D"/><stop offset="1" stop-color="#17102F"/></linearGradient>
    <radialGradient id="cyanGlow"><stop stop-color="#0EA5E9" stop-opacity="0.28"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient>
    <radialGradient id="violetGlow"><stop stop-color="#7C3AED" stop-opacity="0.22"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#94A3B8" stroke-opacity="0.055"/><circle cx="1.5" cy="1.5" r="1.2" fill="#94A3B8" opacity="0.12"/></pattern>
    <clipPath id="frame"><rect width="1280" height="420" rx="42"/></clipPath>
