    <circle cx="1120" cy="170" r="330" fill="url(#cyanGlow)"/>
    <circle cx="80" cy="410" r="280" fill="url(#violetGlow)"/>

    <path d="M0 0H1280" fill="none" stroke="url(#aurora)" stroke-width="4"/>
    <path d="M824 -45C1040 5 1193 115 1328 294" fill="none" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="52" stroke-linecap="round"/>
    <path d="M854 -56C1060 -4 1210 102 1342 275" fill="none" stroke="#8B5CF6" stroke-opacity="0.1" stroke-width="18" stroke-linecap="round"/>

