      </g>

      <text x="0" y="105" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-2.5">devgokuamlabs</text>
      <text x="2" y="147" fill="#B6C5D8" font-family="Arial, Helvetica, sans-serif" font-size="21">Applied software engineering for real-world programs.</text>

