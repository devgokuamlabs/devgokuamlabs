<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">devgokuamlabs professional GitHub workspace</title>
  <desc id="desc">A clean modern banner for applied software engineering work.</desc>
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0B1B2B"/><stop offset="1" stop-color="#16102D"/></linearGradient>
    <radialGradient id="cyanGlow"><stop stop-color="#0EA5E9" stop-opacity="0.22"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient>
    <radialGradient id="violetGlow"><stop stop-color="#7C3AED" stop-opacity="0.18"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#94A3B8" opacity="0.065"/></pattern>
    <clipPath id="frame"><rect width="1280" height="360" rx="38"/></clipPath>
  </defs>

